version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: second_number_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: second_number
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: second_number_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      HOST: "0.0.0.0"
      BASE_URL: ${BASE_URL:-http://localhost:3000}
      API_SECRET_KEY: ${API_SECRET_KEY:-test-secret-token}
      DATABASE_URL: "postgres://postgres:postgrespassword@postgres:5432/second_number"
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}
      TWILIO_VALIDATE_WEBHOOKS: ${TWILIO_VALIDATE_WEBHOOKS:-false}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
